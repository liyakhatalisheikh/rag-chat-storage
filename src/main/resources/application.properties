spring.application.name=rag-chat-storage

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:ragchat}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# API Key Configuration (Should be overridden by env var)
app.api.key=${APP_API_KEY:test-key-1234}

# Logging
logging.level.com.ragchat.storage=DEBUG
logging.level.org.springframework.web=INFO

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Rate Limiting
app.rate-limit.requests=${RATE_LIMIT_REQUESTS:10}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW:60}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
